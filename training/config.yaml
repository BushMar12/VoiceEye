# VoiceEye FastLane training configuration.
# Single source of truth for train.py, pipeline.py, and hpo.py.

# ClearML
clearml_project: "VoiceEye"
clearml_task_name: "YOLO26n Training"
dataset_id: "eb9fd0e9607242029dbf8fe729b88b4f"

# Model
model_weights: "yolo26n.pt"

# Hardware
device: "0"
workers: 8
amp: false
cache: false

# Training
epochs: 150
patience: 50
batch: 16
imgsz: 640
optimizer: "AdamW"
lr0: 0.001
lrf: 0.01
cos_lr: true
warmup_epochs: 5
warmup_momentum: 0.8
weight_decay: 0.0005
dropout: 0.0
close_mosaic: 10

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
erasing: 0.0

# Dataset sanity gates
min_train_images: 1000
min_val_images: 100

# Export
export_format: "onnx"
export_imgsz: 640
half: false
export_opset: 17
export_simplify: true

# Validation thresholds
conf_threshold: 0.25
iou_threshold: 0.45
min_map50: 0.40

# HPO
hpo_max_trials: 20
hpo_time_limit_minutes: 480
hpo_concurrent_tasks: 2
hpo_trial_epochs: 50
hpo_trial_patience: 15

# ClearML Agent queues
queue_gpu: "gpu"
queue_cpu: "cpu"
