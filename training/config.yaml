# VoiceEye FastLane training configuration.
# Single source of truth for train.py, pipeline.py, and hpo.py.

# ClearML
clearml_project: "VoiceEye"
clearml_task_name: "YOLO26n Training"
dataset_id: "eb9fd0e9607242029dbf8fe729b88b4f"

# Model
model_weights: "yolo26n.pt"

# Hardware
device: "0"
workers: 8
amp: false
cache: false

# Training
epochs: 5
patience: 50
batch: 16
imgsz: 640
optimizer: "AdamW"
lr0: 0.001
lrf: 0.01
cos_lr: true
warmup_epochs: 5
warmup_momentum: 0.8
weight_decay: 0.0005
dropout: 0.0
close_mosaic: 10

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
erasing: 0.0

# Dataset sanity gates
min_train_images: 1000
min_val_images: 100

# Export
export_format: "onnx"
export_imgsz: 640
half: false
export_opset: 17
export_simplify: true

# Validation thresholds
conf_threshold: 0.25
iou_threshold: 0.45
min_map50: 0.40
production_tag: "production"         # tag applied to export task when quality gate passes

# Pipeline mode — gates which steps run when pipeline.py launches.
#   train      : data_prep -> train -> evaluate -> export   (cheap, default)
#   hpo+train  : data_prep -> hpo   -> train -> evaluate -> export
#   hpo-only   : data_prep -> hpo                            (search only, no commit)
pipeline_mode: "train"

# HPO
hpo_max_trials: 4
hpo_time_limit_minutes: 480
hpo_concurrent_tasks: 2
hpo_trial_epochs: 3
hpo_trial_patience: 3
# Required when pipeline_mode includes "hpo". Create with:
#   python training/train.py --epochs 5 --data data/final/data.yaml
# then paste the resulting ClearML task ID here.
hpo_template_task_id: "9b58b53607e2480abe735935fd81e99a"

# ClearML Agent queues
queue_gpu: "gpu"
queue_cpu: "cpu"
queue_services: "services"           # long-lived queue for pipeline controllers
