# Cloudflare Pages project config.
# Picked up automatically by `wrangler pages deploy` and by `wrangler pages dev`.
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "voiceeye"
pages_build_output_dir = "./dist"
compatibility_date = "2026-04-24"

# Workers AI binding — used by functions/api/vlm.ts to run the VLM
# (Llama 3.2 11B Vision by default) at Cloudflare's edge, so the Slow
# Lane no longer needs a local Ollama or a cloudflared tunnel.
[ai]
binding = "AI"

# Default variables accessible from Pages Functions as `env.VLM_MODEL` etc.
# Override per-deploy from the Cloudflare dashboard (Environment variables tab).
[vars]
VLM_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
VLM_MAX_TOKENS = "512"
VLM_TEMPERATURE = "0.2"
