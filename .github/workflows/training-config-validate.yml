name: Validate Training Config

on:
  pull_request:
    branches: [main]
    paths:
      - "training/config.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate config.yaml
        run: python training/validate_config.py
